<style>
:root{
  color-scheme:light;
  --white:#FFFFFF;
  --sky-50:#F4F9FD;
  --sky-100:#E6F1FA;
  --sky-200:#CFE3F4;
  --sky-300:#A9CCEB;
  --blue-600:#226DAE;
  --blue-700:#1D5F99;
  --navy:#0F2A44;
  --ink:#24313D;
  --muted:#5A6B7B;
  --rule:#DDE8F1;
  --shadow:0 1px 2px rgba(15,42,68,.06), 0 14px 34px -20px rgba(15,42,68,.28);
  --sans:"Inter","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{
  margin:0;background:var(--white);color:var(--ink);
  font-family:var(--sans);font-size:17px;line-height:1.65;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
img{max-width:100%}
a{color:var(--blue-700)}
a:focus-visible,button:focus-visible{outline:3px solid var(--sky-300);outline-offset:2px;border-radius:8px}
.wrap{max-width:1100px;margin:0 auto;padding:0 32px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  background:rgba(255,255,255,.92);
  -webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--rule);
}
.topbar .wrap{display:flex;align-items:center;gap:24px;height:64px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--navy);font-weight:600;font-size:15.5px;letter-spacing:-.005em}
.mono{
  width:34px;height:34px;border-radius:9px;flex:none;
  background:linear-gradient(145deg,#2F80C4,var(--blue-700));
  color:#fff;display:grid;place-items:center;
  font-size:12.5px;font-weight:700;letter-spacing:.05em;
}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;padding:8px 11px;border-radius:8px;transition:color .15s,background .15s}
.nav a:hover{color:var(--navy);background:var(--sky-50)}
.langs{display:flex;gap:2px;padding:3px;background:var(--sky-50);border:1px solid var(--rule);border-radius:10px}
.langs button{
  font:600 11.5px/1 var(--sans);letter-spacing:.06em;
  background:none;border:0;padding:7px 8px;border-radius:7px;
  color:var(--muted);cursor:pointer;
}
.langs button:hover{color:var(--navy)}
.langs button[aria-current="true"]{background:var(--white);color:var(--blue-700);box-shadow:0 1px 3px rgba(15,42,68,.14)}

/* ---------- hero ---------- */
.hero{
  position:relative;overflow:hidden;
  background:linear-gradient(180deg,var(--white) 0%,var(--sky-50) 55%,var(--sky-100) 100%);
  border-bottom:1px solid var(--rule);
}
.hero::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(var(--sky-200) 1.2px,transparent 1.2px);
  background-size:22px 22px;
  -webkit-mask-image:linear-gradient(90deg,transparent 35%,#000 100%);
  mask-image:linear-gradient(90deg,transparent 35%,#000 100%);
}
.hero .wrap{
  position:relative;display:grid;
  grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);
  gap:64px;align-items:center;padding-top:92px;padding-bottom:104px;
}
.eyebrow{
  display:inline-flex;align-items:center;gap:12px;margin:0 0 20px;
  font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--blue-700);
}
.eyebrow::before{content:"";width:30px;height:2px;border-radius:2px;background:var(--blue-600)}
h1{
  font-size:clamp(42px,5.8vw,68px);line-height:1.02;letter-spacing:-.03em;
  font-weight:700;color:var(--navy);margin:0 0 16px;
}
.place{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:15px;margin:0 0 28px}
.place svg{width:16px;height:16px;fill:var(--blue-600);flex:none}
.lede{font-size:19px;line-height:1.7;color:var(--ink);margin:0 0 36px;max-width:35em}
.actions{display:flex;flex-wrap:wrap;gap:12px}

.btn{
  display:inline-flex;align-items:center;gap:9px;
  font:600 15px/1 var(--sans);text-decoration:none;
  padding:14px 20px;border-radius:10px;
  border:1px solid var(--rule);background:var(--white);color:var(--navy);
  transition:border-color .15s,background .15s,color .15s,transform .15s,box-shadow .15s;
}
.btn:hover{border-color:var(--sky-300);box-shadow:var(--shadow);transform:translateY(-1px)}
.btn svg{width:17px;height:17px;fill:currentColor;flex:none}
.btn-primary{background:var(--blue-600);border-color:var(--blue-600);color:#fff}
.btn-primary:hover{background:var(--blue-700);border-color:var(--blue-700)}
.btn-sm{padding:10px 14px;font-size:14px;border-radius:9px}

.portrait-wrap{position:relative;justify-self:end;width:min(100%,380px)}
.portrait-wrap::before{
  content:"";position:absolute;inset:28px -24px -24px 28px;z-index:0;
  border-radius:24px;background:linear-gradient(135deg,var(--sky-300),var(--sky-100));
}
.portrait{
  position:relative;z-index:1;display:block;width:100%;height:auto;
  aspect-ratio:4/5;object-fit:cover;object-position:50% 30%;
  border-radius:24px;border:6px solid var(--white);
  box-shadow:0 34px 64px -30px rgba(15,42,68,.5);
}
.portrait-tag{
  position:absolute;z-index:2;left:-32px;bottom:40px;
  display:flex;align-items:center;gap:12px;
  background:var(--white);border:1px solid var(--rule);border-radius:14px;
  padding:12px 18px 12px 12px;box-shadow:var(--shadow);text-decoration:none;
}
.portrait-tag .ti{width:38px;height:38px;border-radius:10px;background:var(--sky-100);display:grid;place-items:center;flex:none}
.portrait-tag .ti svg{width:19px;height:19px;fill:var(--blue-700)}
.portrait-tag b{display:block;font-family:var(--serif);font-style:italic;font-weight:600;font-size:17px;color:var(--navy);line-height:1.2}
.portrait-tag span{display:block;font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);line-height:1.4}

/* ---------- sections ---------- */
.section{padding:100px 0}
.section.alt{background:var(--sky-50);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
h2{
  font-size:clamp(28px,3.2vw,38px);line-height:1.15;letter-spacing:-.022em;
  font-weight:700;color:var(--navy);margin:0 0 28px;
}
h2::before{content:"";display:block;width:38px;height:3px;border-radius:3px;background:var(--blue-600);margin-bottom:20px}

/* about */
.split{display:grid;grid-template-columns:280px minmax(0,1fr);gap:64px;align-items:start}
.split h2{margin:0}
.about-text{font-size:19px;line-height:1.75;color:var(--ink);margin:0;max-width:40em}

/* book */
.book{
  display:grid;grid-template-columns:210px minmax(0,1fr);gap:56px;align-items:center;
  background:var(--white);border:1px solid var(--rule);border-radius:22px;
  padding:48px 56px 48px 48px;box-shadow:var(--shadow);
}
.cover{
  aspect-ratio:2/3;border-radius:5px 12px 12px 5px;padding:24px 20px;
  display:flex;flex-direction:column;justify-content:space-between;color:#fff;
  background:
    linear-gradient(90deg,rgba(255,255,255,.16) 0,rgba(255,255,255,.16) 7px,transparent 7px),
    linear-gradient(160deg,#3A8ACD 0%,var(--blue-700) 52%,var(--navy) 100%);
  box-shadow:0 28px 44px -24px rgba(15,42,68,.65);
}
.cover .ct{font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.02;letter-spacing:-.01em}
.cover .cs{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;line-height:1.5;opacity:.85;margin-top:12px}
.cover .ca{font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;opacity:.9}
.book-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 16px}
.book h3{font-family:var(--serif);font-style:italic;font-weight:600;font-size:38px;line-height:1.1;color:var(--navy);margin:0}
.badge{
  font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--blue-700);background:var(--sky-100);border-radius:999px;padding:6px 12px;
}
.book p{margin:0;font-size:18px;line-height:1.75;color:var(--ink)}

/* interest cards */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.card{
  display:flex;flex-direction:column;gap:14px;
  background:var(--white);border:1px solid var(--rule);border-radius:20px;padding:32px;
  transition:border-color .2s,box-shadow .2s,transform .2s;
}
.card:hover{border-color:var(--sky-300);box-shadow:var(--shadow);transform:translateY(-2px)}
.icon{width:48px;height:48px;border-radius:13px;background:var(--sky-100);display:grid;place-items:center;margin-bottom:6px}
.icon svg{width:23px;height:23px;fill:var(--blue-700)}
.card h2{font-size:22px;letter-spacing:-.01em;margin:0}
.card h2::before{display:none}
.card p{margin:0;color:var(--muted);font-size:16px;line-height:1.7}
.card .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:8px}
.stat{display:flex;align-items:baseline;gap:10px}
.stat b{font-size:40px;font-weight:700;letter-spacing:-.02em;color:var(--navy);line-height:1}
.stat span{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--blue-700)}

/* contact */
.contact{
  position:relative;overflow:hidden;color:#fff;padding:96px 0;
  background:linear-gradient(135deg,#2A78BD 0%,var(--blue-700) 55%,#16507F 100%);
}
.contact::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.16) 1.2px,transparent 1.2px);
  background-size:22px 22px;
  -webkit-mask-image:linear-gradient(270deg,transparent 30%,#000 100%);
  mask-image:linear-gradient(270deg,transparent 30%,#000 100%);
}
.contact .wrap{position:relative}
.contact h2{color:#fff}
.contact h2::before{background:var(--sky-300)}
.mail{
  display:inline-block;margin:0 0 34px;
  font-size:clamp(22px,3.4vw,34px);font-weight:600;letter-spacing:-.015em;
  color:#fff;text-decoration:none;border-bottom:2px solid rgba(255,255,255,.35);
  transition:border-color .15s;overflow-wrap:anywhere;
}
.mail:hover{border-color:#fff}
.contact .actions .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3);color:#fff}
.contact .actions .btn:hover{background:var(--white);border-color:var(--white);color:var(--navy);box-shadow:none}

/* footer */
footer{background:var(--white)}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:28px;padding-bottom:34px}
.foot p{margin:0;font-size:13.5px;color:var(--muted)}

/* ---------- responsive ---------- */
@media (max-width:980px){
  .nav{display:none}
  .langs{margin-left:auto}
  .hero .wrap{grid-template-columns:1fr;gap:44px;padding-top:48px;padding-bottom:72px}
  .portrait-wrap{order:-1;justify-self:start;width:min(72%,280px)}
  .portrait-tag{left:auto;right:-40px;bottom:24px}
  .split{grid-template-columns:1fr;gap:0}
  .split h2{margin-bottom:24px}
  .cards{grid-template-columns:1fr 1fr}
  .book{grid-template-columns:170px minmax(0,1fr);gap:36px;padding:36px}
}
@media (max-width:660px){
  body{font-size:16px}
  .wrap{padding:0 20px}
  .section{padding:68px 0}
  .contact{padding:72px 0}
  .lede,.about-text{font-size:17.5px}
  .cards{grid-template-columns:1fr}
  .book{grid-template-columns:1fr;gap:28px;padding:28px}
  .cover{width:150px}
  .book h3{font-size:32px}
  .portrait-tag{right:-28px;padding:10px 14px 10px 10px}
}
@media (max-width:420px){
  .brand .name{display:none}
  .langs button{padding:7px 6px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important}
}
</style>
</head>

const SUPPORTED = Object.keys(I18N);

function setLang(lang){
  if (!I18N[lang]) lang = "en";
  const dict = I18N[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    const v = dict[el.getAttribute("data-i18n")];
    if (v != null) el.textContent = v;
  });
  const meta = document.getElementById("meta-desc");
  if (meta && DESC[lang]) meta.setAttribute("content", DESC[lang]);
  document.querySelectorAll(".langs button").forEach(function(b){
    b.setAttribute("aria-current", String(b.dataset.lang === lang));
  });
  try { localStorage.setItem("lang", lang); } catch (e) {}
}

function initialLang(){
  try {
    const saved = localStorage.getItem("lang");
    if (saved && I18N[saved]) return saved;
  } catch (e) {}
  const prefs = navigator.languages || [navigator.language || "en"];
  for (const pref of prefs) {
    const code = String(pref).slice(0, 2).toLowerCase();
    if (SUPPORTED.indexOf(code) !== -1) return code;
  }
  return "en";
}

document.querySelectorAll(".langs button").forEach(function(b){
  b.addEventListener("click", function(){ setLang(b.dataset.lang); });
});
setLang(initialLang());
