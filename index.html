<style>
:root{
  --slate:#293C4D;
  --teal:#0F7A7A;
  --ink:#1E2830;
  --muted:#5C6874;
  --dim:#8C9AA6;
  --rule:#E1E7EA;
  --bg:#FBFCFC;
  --card:#FFFFFF;
  --sans:"IBM Plex Sans","Segoe UI",Arial,sans-serif;
  --serif:"IBM Plex Serif",Georgia,serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --slate:#DCE5EC; --teal:#4FBDBD; --ink:#E6ECF1; --muted:#A6B4C0; --dim:#7E8D9A;
    --rule:#2A3540; --bg:#161D24; --card:#1D262E;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--serif); font-size:17px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%}
a{color:var(--teal)}
.wrap{max-width:840px;margin:0 auto;padding:0 24px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  background:var(--bg);
  border-bottom:1px solid var(--rule);
}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:52px}
.brand{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.langs{display:flex;gap:2px}
.langs button{
  font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  background:none; border:0; padding:6px 8px; border-radius:5px;
  color:var(--dim); cursor:pointer;
}
.langs button:hover{color:var(--ink);background:var(--rule)}
.langs button[aria-current="true"]{color:#fff;background:var(--teal)}

/* ---------- hero ---------- */
.hero{padding:56px 0 40px;display:grid;grid-template-columns:150px 1fr;gap:32px;align-items:start}
.portrait{
  width:150px;height:150px;border-radius:50%;object-fit:cover;
  border:3px solid var(--card); box-shadow:0 2px 20px rgba(41,60,77,.16);
}
h1{
  font-family:var(--sans); font-weight:500; font-size:38px; line-height:1.05;
  letter-spacing:.01em; margin:0 0 10px; color:var(--slate);
}
.role{
  font-family:var(--mono); font-size:12px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--teal); margin:0 0 4px;
}
.place{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--dim);margin:0 0 18px}
.lede{margin:0;font-size:17.5px;color:var(--ink)}

/* ---------- sections ---------- */
section{padding:34px 0;border-top:1px solid var(--rule)}
h2{
  font-family:var(--sans); font-size:12px; font-weight:600;
  letter-spacing:.19em; text-transform:uppercase; color:var(--teal);
  margin:0 0 18px; display:flex; align-items:center; gap:14px;
}
h2::after{content:"";flex:1;height:1px;background:var(--rule)}
.lead{margin:0 0 22px;color:var(--ink)}
.lead:last-child{margin-bottom:0}

/* ---------- work ---------- */
.job{margin-bottom:26px}
.job:last-of-type{margin-bottom:0}
.job-top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.job h3{font-family:var(--sans);font-size:17px;font-weight:600;margin:0;color:var(--slate)}
.when{font-family:var(--mono);font-size:11.5px;color:var(--dim);white-space:nowrap}
.org{font-family:var(--sans);font-size:13.5px;color:var(--muted);margin:2px 0 8px}
.job p{margin:0;color:var(--ink);font-size:16.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 24px;padding:0;list-style:none}
.tags li{
  font-family:var(--mono);font-size:11px;letter-spacing:.04em;
  color:var(--muted);background:var(--card);
  border:1px solid var(--rule);border-radius:20px;padding:4px 11px;
}
.creds{margin:26px 0 0;padding:0;list-style:none;border-top:1px solid var(--rule)}
.creds li{
  display:flex;justify-content:space-between;align-items:baseline;gap:16px;
  padding:9px 0;border-bottom:1px solid var(--rule);font-size:15.5px;
}
.creds .cy{font-family:var(--mono);font-size:11.5px;color:var(--dim);white-space:nowrap}

/* ---------- book ---------- */
.book{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 12px}
.book h3{
  font-family:var(--sans);font-size:26px;font-weight:500;font-style:italic;
  margin:0;color:var(--slate);letter-spacing:.01em;
}
.badge{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--teal);border:1px solid var(--teal);border-radius:20px;padding:3px 10px;
}

/* ---------- link buttons ---------- */
.links{display:flex;flex-wrap:wrap;gap:9px;margin:0}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--sans);font-size:14px;font-weight:500;text-decoration:none;
  color:var(--slate);background:var(--card);
  border:1px solid var(--rule);border-radius:7px;padding:9px 14px;
  transition:border-color .15s, transform .15s;
}
.btn:hover{border-color:var(--teal);transform:translateY(-1px)}
.btn svg{width:15px;height:15px;flex:none;fill:currentColor;opacity:.7}

/* ---------- stat ---------- */
.stat{display:flex;align-items:baseline;gap:12px;margin:0 0 14px}
.stat b{font-family:var(--sans);font-size:34px;font-weight:600;color:var(--slate);line-height:1}
.stat span{font-family:var(--mono);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--rule);padding:30px 0 44px;margin-top:10px}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.foot p{margin:0;font-family:var(--mono);font-size:11.5px;color:var(--dim);letter-spacing:.03em}
.mail{font-family:var(--mono);font-size:15px;color:var(--teal);text-decoration:none;border-bottom:1px solid var(--rule)}
.mail:hover{border-color:var(--teal)}

@media (max-width:620px){
  body{font-size:16px}
  .hero{grid-template-columns:1fr;gap:20px;padding:36px 0 28px}
  .portrait{width:112px;height:112px}
  h1{font-size:31px}
  .book h3{font-size:22px}
  .when{white-space:normal}
}
</style>

const SUPPORTED = Object.keys(I18N);

function setLang(lang){
  if (!I18N[lang]) lang = "en";
  const dict = I18N[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    const v = dict[el.getAttribute("data-i18n")];
    if (v != null) el.textContent = v;
  });
  const meta = document.getElementById("meta-desc");
  if (meta && DESC[lang]) meta.setAttribute("content", DESC[lang]);
  document.querySelectorAll(".langs button").forEach(function(b){
    b.setAttribute("aria-current", String(b.dataset.lang === lang));
  });
  try { localStorage.setItem("lang", lang); } catch (e) {}
}

function initialLang(){
  try {
    const saved = localStorage.getItem("lang");
    if (saved && I18N[saved]) return saved;
  } catch (e) {}
  const prefs = navigator.languages || [navigator.language || "en"];
  for (const pref of prefs) {
    const code = String(pref).slice(0, 2).toLowerCase();
    if (SUPPORTED.indexOf(code) !== -1) return code;
  }
  return "en";
}

document.querySelectorAll(".langs button").forEach(function(b){
  b.addEventListener("click", function(){ setLang(b.dataset.lang); });
});
setLang(initialLang());
